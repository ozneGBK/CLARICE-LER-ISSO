<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma pergunta importante 🎸</title>
<style>
  :root { --ink:#24202d; --pink:#ff6fae; --yellow:#ffe66d; --blue:#7bdff2; --green:#b2f7a8; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, #fde7f0, #f8d7e8 55%, #fcecf3);
  }
  .sticker { position: fixed; font-size: clamp(1.5rem, 4vw, 3rem); opacity: .9; animation: float 5s ease-in-out infinite; user-select:none;
    filter: drop-shadow(3px 4px 0 rgba(45,35,35,.18)); }
  .s1{top:8%;left:8%;transform:rotate(-15deg)} .s2{top:15%;right:9%;animation-delay:1s}
  .s3{bottom:9%;left:12%;animation-delay:2s} .s4{bottom:12%;right:10%;animation-delay:.5s}
  @keyframes float { 0%,100%{translate:0 0} 50%{translate:0 -14px} }
  main {
    width: min(92vw, 560px); padding: clamp(25px, 6vw, 48px); text-align:center;
    background: #f8d7e8; color: #24202d; border: 2px solid #fffaf0;
    border-radius: 4px 7px 5px 3px;
    box-shadow: 8px 9px 0 #e8b8ce, 13px 14px 0 rgba(120,70,95,.18);
    position:relative; transform: rotate(-1deg);
  }
  main::before {
    content:""; position:absolute; inset:9px; border:1.5px dashed #d99bb8;
    pointer-events:none; transform:rotate(.4deg);
  }
  /* Letras com aparência de recortes reais de revistas: fontes, papéis e rotações variados. */
  .cutout { display:inline-flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:.08em .13em; }
  .cutout .letter {
    display:inline-block; padding:.015em .10em .055em; margin:.025em 0;
    color:var(--letter-ink, #25201d); background:var(--paper, #eee6d9);
    font-family:var(--letter-font, Georgia, serif); font-weight:var(--letter-weight, 900);
    font-style:var(--letter-style, normal); line-height:1.02;
    text-shadow:var(--print-shadow, none);
    box-shadow:1px 2px 0 rgba(48,35,27,.22);
    transform:rotate(var(--tilt, -2deg));
  }
  .cutout .letter:nth-child(8n+1) { --paper:#6b493b; --letter-ink:#241914; --letter-font:Georgia,serif; --tilt:-3deg; }
  .cutout .letter:nth-child(8n+2) { --paper:#e9dfcf; --letter-ink:#171310; --letter-font:'Times New Roman',serif; --tilt:2deg; }
  .cutout .letter:nth-child(8n+3) { --paper:#d8d0bd; --letter-ink:#101b19; --letter-font:Georgia,serif; --tilt:-1deg; }
  .cutout .letter:nth-child(8n+4) { --paper:#e8d9c9; --letter-ink:#142525; --letter-font:Impact, sans-serif; --tilt:3deg; }
  .cutout .letter:nth-child(8n+5) { --paper:#f0e8dc; --letter-ink:#17120f; --letter-font:'Courier New',monospace; --tilt:-2deg; }
  .cutout .letter:nth-child(8n+6) { --paper:#b8c2ad; --letter-ink:#14251c; --letter-font:'Trebuchet MS',sans-serif; --letter-style:italic; --tilt:2deg; }
  .cutout .letter:nth-child(8n+7) { --paper:#d6b5b0; --letter-ink:#35151f; --letter-font:'Palatino Linotype',Georgia,serif; --tilt:-3deg; }
  .cutout .letter:nth-child(8n) { --paper:#eee2b9; --letter-ink:#1b100a; --letter-font:'Arial Black',Arial,sans-serif; --tilt:3deg; }
  .cutout .space { display:inline-block; width:.22em; }
  .tag { display:inline-block; padding:8px 15px; border:2px solid var(--ink);
    border-radius:2px; background:var(--yellow); font-weight:900; letter-spacing:.08em;
    font-size:.75rem; transform:rotate(-4deg); box-shadow:3px 4px 0 #d9b9a2; }
  h1 { font-size:clamp(2rem, 8vw, 3.2rem); line-height:1.03; margin:20px 0 12px;
    display:inline-block; padding:5px 9px; color:#24202d; background:#ffffff; transform:rotate(1.5deg);
    box-shadow:4px 4px 0 #bdbdbd; }
  p { font-size:clamp(1rem, 3.5vw, 1.2rem); line-height:1.5; margin:0 auto 24px; max-width:410px;
    display:table; padding:10px 13px; color:#24202d; background:#ffffff; transform:rotate(-1deg);
    box-shadow:4px 4px 0 #bdbdbd; }
  .guitar { font-size:2.4rem; display:block; margin:12px 0; filter:drop-shadow(3px 3px 0 #e8c65d); }
  .buttons { min-height:58px; display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; }
  button { border:2px solid var(--ink); border-radius:3px 7px 2px 5px; padding:13px 25px; font-size:1.05rem; font-weight:900;
    cursor:pointer; box-shadow:4px 5px 0 rgba(48,41,54,.75); transition:transform .12s, box-shadow .12s;
    clip-path:polygon(2% 0, 98% 2%, 100% 95%, 3% 100%, 0 6%); }
  button:active { transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink); }
  #yes { background:#ff91b9; transform:rotate(-2deg); }
  #no { background:#8bdce9; position:relative; transform:rotate(2deg); }
  .tiny { margin-top:22px; font-size:.78rem; opacity:.82; color:#765268; }
  #result {
    display:none;
    margin-top:22px;
    padding:14px;
    border:2px dashed #e7a9c4;
    border-radius:14px;
    background:#fff7fb;
    box-shadow:4px 5px 0 rgba(190, 126, 157, .25);
  }
  #result img {
    display:block;
    width:min(100%, 420px);
    max-height:55vh;
    object-fit:contain;
    margin:0 auto;
    border-radius:8px;
  }
  .confetti { position:fixed; top:-20px; font-size:22px; pointer-events:none; animation:fall 2.8s linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(540deg); opacity:0; } }

  /* Ajustes de leitura: mais espaço, letras maiores e menos inclinação. */
  body { min-height:100svh; overflow-x:hidden; overflow-y:auto; padding:22px 0; }
  main { width:min(94vw, 620px); padding:clamp(28px, 6vw, 52px); transform:none; }
  main::before { inset:8px; }
  .cutout { gap:.12em .16em; line-height:1.2; }
  .cutout .letter { padding:.06em .13em .09em; text-shadow:none; box-shadow:1px 2px 0 rgba(25,18,15,.28); }
  .cutout .letter:nth-child(8n+1) { --letter-ink:#fffaf2; }
  h1 { max-width:100%; font-size:clamp(1.8rem, 6.2vw, 2.8rem); line-height:1.2; margin:22px auto 18px; padding:8px 12px; transform:none; box-shadow:3px 3px 0 #bdbdbd; }
  p { display:block; width:100%; max-width:480px; padding:14px 16px; margin:0 auto 26px; font-size:clamp(1.08rem, 3.8vw, 1.3rem); line-height:1.7; transform:none; box-shadow:3px 3px 0 #bdbdbd; }
  .tag { font-size:.88rem; letter-spacing:.05em; transform:none; }
  .buttons { gap:16px; }
  button { min-width:112px; padding:15px 24px; font-size:1.12rem; }
  .tiny { font-size:.92rem; line-height:1.5; opacity:1; }
  #result { font-size:1.1rem; line-height:1.6; }
  @media (max-width:420px) { main { width:94vw; padding:28px 20px; } .sticker { opacity:.55; } }

</style>
</head>

  <main>
    <span class="tag">PERGUNTA IMPORTANTE</span>
    <h1 id="question-title">Oi, posso te fazer umas perguntinhas?</h1>
    <p id="question-text">Prometo que é rapidinho... ou quase KKKKK.</p>
    <div class="buttons" id="question-buttons">

    <div id="result">EU SABIA! 💖 Agora oficialmente temos uma ótima história pra contar. 🎉</div>
    <div class="tiny" id="music-note">♫ uma trilha instrumental começa na primeira resposta</div>
  </main>
<script>
  const title = document.getElementById('question-title');
  const paragraph = document.getElementById('question-text');
  const buttons = document.getElementById('question-buttons');
  const first = document.getElementById('answer-one');
  const second = document.getElementById('answer-two');
  const result = document.getElementById('result');

  const steps = [
    {
      title: 'Oi. Posso te fazer umas perguntas?',
      text: 'É rapidinho. Prometo não transformar isso numa entrevista de emprego.',
      a: 'Pode', b: 'Depende' 
    },
    {
      title: 'Você me acha uma pessoa legal?',
      text: 'Pode falar a verdade. Vou tentar não levar pro pessoal.',
      a: 'Sim', b: 'Às vezes' 
    },
    {
      title: 'Tem certeza?',
      text: 'Última chance de revisar a resposta. Sem pressão (muita).',
      a: 'Tenho', b: 'Quero reconsiderar' 
    },
    {
      title: 'Posso te contar uma coisa?',
      text: 'Sem suspense desnecessário. Ou quase nenhum.',
      a: 'Fala', b: 'Lá vem...' 
    },
    {
      title: 'Promete não rir da próxima pergunta?',
      text: 'Não é uma pergunta tão difícil. Eu acho.',
      a: 'Prometo', b: 'Não garanto' 
    },
    {
      title: 'Já imagina o que eu quero perguntar?',
      text: 'Se já sabe, pode fingir surpresa por educação.',
      a: 'Tenho um palpite', b: 'Nenhuma ideia' 
    },
    {
      title: 'Pronta para a pergunta final?',
      text: 'Chegamos à última etapa. Não tem prova no final, prometo.',
      a: 'Pode perguntar', b: 'Lá vem problema' 
    }
  ];

  decorateText(document.getElementById('question-title'));
  decorateText(document.getElementById('question-text'));
  decorateText(document.querySelector('.tag'));
  decorateText(first); decorateText(second);

  let step = 0;
  let audioContext = null;
  let musicGain = null;
  let musicTimer = null;
  let musicLevel = 0.24;

  // Trilha original mais animada, com batida pop/chiptune criada no navegador.
  function startMusic() {
    if (audioContext) {
      if (audioContext.state === 'suspended') audioContext.resume();
      return;
    }
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) {
      document.getElementById('music-note').textContent = '♫ seu navegador não permite tocar a trilha';
      return;
    }
    audioContext = new AudioCtx();
    audioContext.resume();
    musicGain = audioContext.createGain();
    musicGain.gain.value = 0;
    musicGain.connect(audioContext.destination);

    const bpm = 116;
    const stepMs = 60000 / bpm / 2;
    const melody = [659.25, 783.99, 880.00, 783.99, 659.25, 587.33, 523.25, 587.33,
                    659.25, 783.99, 987.77, 880.00, 783.99, 659.25, 587.33, 523.25];
    const bass = [130.81, 130.81, 164.81, 164.81, 174.61, 174.61, 146.83, 146.83];
    let tick = 0;

    function tone(freq, duration, type, volume, when = audioContext.currentTime) {
      const osc = audioContext.createOscillator();
      const env = audioContext.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, when);
      env.gain.setValueAtTime(0.0001, when);
      env.gain.exponentialRampToValueAtTime(volume, when + 0.012);
      env.gain.exponentialRampToValueAtTime(0.0001, when + duration);
      osc.connect(env);
      env.connect(musicGain);
      osc.start(when);
      osc.stop(when + duration + 0.025);
    }

    function kick(when) {
      const osc = audioContext.createOscillator();
      const env = audioContext.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(125, when);
      osc.frequency.exponentialRampToValueAtTime(48, when + 0.13);
      env.gain.setValueAtTime(0.20, when);
      env.gain.exponentialRampToValueAtTime(0.0001, when + 0.16);
      osc.connect(env); env.connect(musicGain);
      osc.start(when); osc.stop(when + 0.17);
    }

    function noiseHit(when, duration, volume, highpass) {
      const length = Math.floor(audioContext.sampleRate * duration);
      const buffer = audioContext.createBuffer(1, length, audioContext.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
      const src = audioContext.createBufferSource();
      const filter = audioContext.createBiquadFilter();
      const env = audioContext.createGain();
      src.buffer = buffer;
      filter.type = 'highpass'; filter.frequency.value = highpass;
      env.gain.setValueAtTime(volume, when);
      env.gain.exponentialRampToValueAtTime(0.0001, when + duration);
      src.connect(filter); filter.connect(env); env.connect(musicGain);
      src.start(when); src.stop(when + duration);
    }

    musicTimer = window.setInterval(() => {
      if (!audioContext || audioContext.state !== 'running') return;
      const now = audioContext.currentTime + 0.015;
      const beat = tick % 8;
      if (beat === 0 || beat === 4) kick(now);
      if (beat === 2 || beat === 6) noiseHit(now, 0.12, 0.055, 1400);
      if (tick % 2 === 1) noiseHit(now, 0.035, 0.018, 6500);
      if (beat === 0 || beat === 4) tone(bass[Math.floor(tick / 8) % bass.length], 0.28, 'triangle', 0.10, now);
      if (tick % 2 === 0) tone(melody[tick % melody.length], 0.19, 'square', 0.045, now);
      if (beat === 0) {
        const chord = [261.63, 329.63, 392.00];
        chord.forEach((freq, i) => tone(freq, 0.42, 'triangle', 0.025, now + i * 0.008));
      }
      tick++;
    }, stepMs);

    document.getElementById('music-note').textContent = '♫ trilha pop animada';
    musicLevel = 0.27;
    musicGain.gain.setTargetAtTime(musicLevel, audioContext.currentTime, 0.25);
  }

  function raiseMusic() {
    if (!audioContext || !musicGain) return;
    musicLevel = Math.min(0.34, musicLevel + 0.025);
    musicGain.gain.setTargetAtTime(musicLevel, audioContext.currentTime, 0.25);
  }

  function decorateText(element) {
    if (!element || element.dataset.cutout === 'true') return;
    const value = element.textContent;
    element.textContent = '';
    element.classList.add('cutout');
    for (const char of Array.from(value)) {
      if (char === ' ') {
        const space = document.createElement('span');
        space.className = 'space';
        space.setAttribute('aria-hidden', 'true');
        element.appendChild(space);
      } else {
        const letter = document.createElement('span');
        letter.className = 'letter';
        letter.textContent = char;
        element.appendChild(letter);
      }
    }
    element.dataset.cutout = 'true';
  }

  function showStep() {
    const current = steps[step];
    title.textContent = current.title;
    paragraph.textContent = current.text;
    first.textContent = current.a;
    second.textContent = current.b;
    second.style.position = 'relative';
    second.style.left = '';
    second.style.top = '';
    [title, paragraph, first, second].forEach(el => { el.dataset.cutout = ''; decorateText(el); });
  }
  function nextStep() {
    startMusic();
    raiseMusic();
    step++;
    if (step < steps.length) {
      showStep();
    } else {
      showProposal();
    }
  }
  first.addEventListener('click', nextStep);
  second.addEventListener('click', nextStep);

  const notificationEmail = 'enzonormalzin28@gmail.com';

  async function notifyByEmail(answer) {
    const note = document.getElementById('music-note');
    if (notificationEmail === 'COLOQUE_SEU_GMAIL_AQUI') {
      note.textContent = '♫ Configure seu Gmail no código para receber a resposta.';
      return;
    }
    // O FormSubmit exige que a página seja aberta por um site/servidor,
    // não diretamente como um arquivo local (file://).
    if (window.location.protocol === 'file:') {
      note.textContent = '♫ publique/abra o site por um link da internet para enviar a resposta 💌';
      return;
    }
    note.textContent = '♫ enviando resposta...';
    try {
      const response = await fetch(`https://formsubmit.co/ajax/${encodeURIComponent(notificationEmail)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          _subject: 'Resposta recebida no site 💗',
          resposta: answer,
          mensagem: `A pessoa clicou em: ${answer}`
        })
      });
      const data = await response.json();
      // O FormSubmit pode responder HTTP 200 mesmo quando não aceitou o envio.
      if (String(data.success) !== 'true') {
        throw new Error(data.message || 'O FormSubmit não aceitou o envio.');
      }
      note.textContent = '♫ resposta enviada! 💌';
    } catch (error) {
      console.error('Erro no FormSubmit:', error);
      note.textContent = `♫ não foi possível enviar: ${error.message || 'verifique a conexão e a confirmação do Gmail'}`;
    }
  }
